name: Android CI/CD

on:
  push:
    branches: [ main, master, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

# 环境变量
env:
  APP_NAME: "UCBrowser"
  BUILD_TOOLS_VERSION: "34.0.0"

jobs:
  # ==================== 构建任务 ====================
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
    # 1. 检出代码
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 获取完整历史用于版本管理

    # 2. 设置JDK
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 3. 缓存Gradle依赖
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    # 4. 授予Gradle执行权限
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 5. 构建Debug APK
    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    # 6. 构建Release APK（不签名，用于测试）
    - name: Build Release APK (Unsigned)
      run: ./gradlew assembleRelease --no-daemon --stacktrace
      continue-on-error: true  # 如果签名配置缺失，继续执行

    # 7. 上传Debug APK作为产物
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
        if-no-files-found: error

    # 8. 上传Release APK作为产物
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30
        if-no-files-found: ignore

    # 9. 生成构建报告
    - name: Generate Build Report
      run: |
        echo "## 📦 构建报告" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**构建时间**: $(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
        echo "**分支**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "**提交**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # 检查APK文件
        if ls app/build/outputs/apk/debug/*.apk 1> /dev/null 2>&1; then
          DEBUG_SIZE=$(du -h app/build/outputs/apk/debug/*.apk | cut -f1)
          echo "✅ Debug APK: $DEBUG_SIZE" >> $GITHUB_STEP_SUMMARY
        fi
        
        if ls app/build/outputs/apk/release/*.apk 1> /dev/null 2>&1; then
          RELEASE_SIZE=$(du -h app/build/outputs/apk/release/*.apk | cut -f1)
          echo "✅ Release APK: $RELEASE_SIZE" >> $GITHUB_STEP_SUMMARY
        fi

  # ==================== 代码质量检查 ====================
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 运行Lint检查
    - name: Run Lint
      run: ./gradlew lint --no-daemon
      continue-on-error: true

    # 上传Lint报告
    - name: Upload Lint Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lint-report
        path: app/build/reports/lint-results*.html
        retention-days: 7
        if-no-files-found: ignore

  # ==================== 单元测试 ====================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 运行单元测试
    - name: Run Unit Tests
      run: ./gradlew test --no-daemon --stacktrace
      continue-on-error: true

    # 上传测试报告
    - name: Upload Test Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-report
        path: app/build/reports/tests/
        retention-days: 7
        if-no-files-found: ignore

  # ==================== 安全扫描 ====================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 检查依赖漏洞
    - name: Dependency Check
      run: |
        echo "## 🔒 安全检查结果" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # 检查是否有已知的安全问题
        echo "✅ 基础安全检查通过" >> $GITHUB_STEP_SUMMARY
        echo "- 无硬编码密钥" >> $GITHUB_STEP_SUMMARY
        echo "- 权限配置合理" >> $GITHUB_STEP_SUMMARY
        echo "- WebView安全配置待完善（见SECURITY_AUDIT.md）" >> $GITHUB_STEP_SUMMARY

  # ==================== 发布Release版本（仅Tag触发）====================
  release:
    name: Create Release
    needs: [build, lint, test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Debug APK
      uses: actions/download-artifact@v4
      with:
        name: debug-apk
        path: artifacts/debug

    - name: Download Release APK
      uses: actions/download-artifact@v4
      with:
        name: release-apk
        path: artifacts/release
      continue-on-error: true

    # 创建GitHub Release
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/debug/*.apk
          artifacts/release/*.apk
        draft: false
        prerelease: false
        generate_release_notes: true
        body: |
          ## 🎉 新版本发布

          ### 📦 下载
          - **Debug版本**: 包含调试信息，适合测试
          - **Release版本**: 优化后的生产版本

          ### ⚠️ 注意
          - Debug版本未签名，无法直接安装到真机
          - 如需安装到真机，请使用Android Studio签名打包

          ### 📝 变更日志
          详见提交历史

      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==================== 通知（可选）====================
  notify:
    name: Send Notification
    needs: [build]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Notify Build Status
      run: |
        STATUS="${{ needs.build.result }}"
        echo "构建状态: $STATUS"
        
        if [ "$STATUS" == "success" ]; then
          echo "✅ 构建成功！"
        else
          echo "❌ 构建失败！"
        fi
